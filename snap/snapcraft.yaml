name: gadget-editor
title: Gadget Editor
version: '0.1.0'
summary: GUI tool for editing gadget YAML files for Ubuntu Core
description: |
  A graphical tool for editing gadget YAML files used in Ubuntu Core systems.
  Allows users to view, modify, and save gadget configuration files for 
  Ubuntu Core devices.

confinement: strict
grade: stable

base: core24

apps:
  gadget-editor:
    command: bin/gadget_editor
    plugs:
      - home
      - network
      - removable-media
      - desktop
      - desktop-legacy
    extensions: [gnome]

parts:
  gadget-editor:
    plugin: nil
    source: .
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
      - git
    stage-packages:
      - squashfs-tools
    override-build: |
      # Set up Flutter environment
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cd $CRAFT_PART_INSTALL/usr/libexec
      git clone --depth 1 -b 3.47.5 https://github.com/flutter/flutter.git
      
      export PATH="$CRAFT_PART_INSTALL/usr/libexec/flutter/bin:$PATH"
      
      # Build Flutter app for Linux
      cd $CRAFT_PART_SRC
      flutter pub get
      flutter build linux --release
      
      # Copy the built application to bin
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
      
      # Fix permissions
      chmod +x $CRAFT_PART_INSTALL/bin/*
    override-prime: |
      craftctl default
      # Clean up Flutter git files
      rm -rf $CRAFT_PRIME/usr/libexec/flutter/.git

