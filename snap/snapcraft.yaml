name: gadget-editor
title: Gadget Editor
version: '0.1.0'
summary: Edit Ubuntu Core Gadget Snap Packages
description: |
  An editor for binary Gadget Snap packages to easily:

    - change volume sizes of the seed and data partitions
    - add/remove entries for auto connections of snaps in the image
    - apply default configurations for snap packages seeded in the image
    - manage kernel command-line parameters
    - change the image file name in the volume definition
    - Add an API Key for a dedicated store
    - manage interface slots the gadget provides
    - and indeed change the name and version of the snap itself

  You can search and download existing gadget snaps from the global store with
  the built in search function or import a local gadget snap file to edit it.

  The gadget snap will only be re-packed after the edit and does not need to be
  compiled from source (which provides full cross architecture support).

  Note that the existing snap assertions will not match anymore after the edit
  and you will have to either re-upload to the store to obtain a fresh signature
  or use it with a "dangerous" model assertion for local image builds.

  If you need to load/save gadget files to/from external media, you need to
  connect the removable-media snap interface with:

      sudo snap connect gadget-editor:removable-media

contact: https://github.com/ogra1/gadget-editor/issues
license: GPL-2.0-only
issues: https://github.com/ogra1/gadget-editor/issues
source-code: https://github.com/ogra1/gadget-editor
website: https://github.com/ogra1/gadget-editor

confinement: strict
grade: stable
compression: lzo

base: core24

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  gadget-editor:
    command: bin/gadget_editor
    plugs:
      - home
      - network
      - removable-media
    extensions: [gnome]

parts:
  gadget-editor:
    plugin: nil
    source: .
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
      - git
      - python3-yaml
    stage-packages:
      - squashfs-tools
      - python3-yaml
    override-build: |
      # Set up Flutter environment
      rm -rf $CRAFT_PART_INSTALL/usr/libexec
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cd $CRAFT_PART_INSTALL/usr/libexec
      git clone --depth 1 -b 3.47.7 https://github.com/flutter/flutter.git
      
      export PATH="$CRAFT_PART_INSTALL/usr/libexec/flutter/bin:$PATH"
      
      # Get flutter dependencies
      cd $CRAFT_PART_SRC
      flutter pub get

      # run flutter tests (and turn off proxy, else they fail)
      set +u
      export NO_PROXY="127.0.0.1,localhost,${NO_PROXY}"
      export no_proxy="127.0.0.1,localhost,${no_proxy}"
      flutter test

      # Build app
      flutter build linux --release
      
      # Copy the built application to bin
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
      cp $CRAFT_PART_SRC/bin/snap_pack $CRAFT_PART_INSTALL/bin/
      
      # Fix permissions
      chmod +x $CRAFT_PART_INSTALL/bin/*

    override-prime: |
      craftctl default
      # Clean up Flutter git files
      rm -rf $CRAFT_PRIME/usr/libexec
